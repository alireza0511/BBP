<style>

    --accent: #d9a660; --accent-soft: #3a3026; --border: #3a342c;

  * { box-sizing: border-box; }
  body {

  }
  html[lang="fa"] body { font-family: Vazirmatn, Tahoma, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0; }
  h2 { font-size: 1.15rem; margin: 0 0 8px; }
  .lang { display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .lang button { background: none; border: 0; padding: 6px 14px; cursor: pointer; color: var(--text); font: inherit; }
  .lang button.on { background: var(--accent); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
  .muted { color: var(--muted); }
  .btn {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .row { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .progress { height: 6px; background: var(--bar-bg); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .progress div { height: 100%; background: var(--accent); transition: width .25s; }
  .tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 2px 12px; font-size: .85rem; font-weight: 600; margin-bottom: 10px; }
  .q { font-size: 1.08rem; font-weight: 600; margin: 4px 0 16px; }
  .opt {
    display: block; width: 100%; text-align: start; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    font: inherit; cursor: pointer;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.sel { background: var(--sel); border-color: var(--accent); font-weight: 600; }
  .opt.skip { color: var(--muted); font-style: italic; }
  .item-res { margin: 14px 0; }
  .item-res .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .bar { height: 10px; background: var(--bar-bg); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .bar div { height: 100%; background: var(--accent); }
  .overall { text-align: center; padding: 16px 0 8px; }
  .overall .num { font-size: 2.6rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .overall .stage { font-size: 1.2rem; font-weight: 600; }
  .next { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin-top: 16px; }
  textarea {
    width: 100%; min-height: 260px; margin-top: 8px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font: .88rem/1.5 ui-monospace, Menlo, Consolas, monospace;

  table.stages { width: 100%; border-collapse: collapse; font-size: .92rem; margin-top: 12px; }
  table.stages td { padding: 6px 4px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.stages td:first-child { white-space: nowrap; color: var(--muted); width: 70px; }
  .hidden { display: none; }
  .note { font-size: .9rem; margin-top: 12px; }
</style>
</head>

    { en: "Someone who once cheated or wronged you is now in need.",
      fa: "کسی که زمانی به شما بدی یا کلاه‌برداری کرده، حالا نیازمند است.",

        [1, "I give nothing.", "هیچ نمی‌دهم."],
        [3, "I give, but remind them of what they did and what I gave.", "می‌دهم، اما کارش و بخشش خودم را یادش می‌آورم."],
        [5, "I give, hoping they'll finally make things right.", "می‌دهم به امید اینکه بالاخره جبران کند."],
        [6, "I give if they ask humbly.", "اگر فروتنانه بخواهد، می‌دهم."],
        [9, "I give generously, and then forget about it.", "سخاوتمندانه می‌دهم و بعد فراموشش می‌کنم."]

  ]},
  { en: "Giving without announcing it", fa: "بخشش پنهان", qs: [

      opts: [
        [3, "I tell people about it, and remind the receiver.", "به دیگران می‌گویم و به گیرنده یادآوری می‌کنم."],
        [4, "I mostly give when it will be seen.", "بیشتر وقتی می‌بخشم که دیده شود."],
        [5, "I don't announce it, but I hope someone finds out.", "اعلامش نمی‌کنم، اما امیدوارم کسی بفهمد."],

        [7, "I arrange it so nobody knows it was me.", "طوری ترتیب می‌دهم که کسی نفهمد کار من بوده."],

      ]},
    { en: "Someone thinks you are stingy, but you have quietly given a lot.",
      fa: "کسی فکر می‌کند شما خسیس هستید، در حالی که بی‌صدا بسیار بخشیده‌اید.",
      opts: [
        [3, "I correct them and list everything I've given.", "اصلاحش می‌کنم و هرچه داده‌ام را برمی‌شمارم."],
        [4, "I make sure the right people find out.", "مطمئن می‌شوم آدم‌های مهم بفهمند."],
        [5, "I stay quiet, but I'm hurt that nobody knows.", "سکوت می‌کنم، اما دلخورم که کسی نمی‌داند."],
        [6, "I stay quiet. It doesn't matter much.", "سکوت می‌کنم. چندان مهم نیست."],
        [8, "I keep it hidden, even though being misjudged costs me.", "پنهانش نگه می‌دارم، حتی اگر قضاوت نادرست برایم گران تمام شود."]
      ]},
    { en: "Which is closest to how you relate to your own giving?",
      fa: "کدام به رابطهٔ شما با بخشش‌های خودتان نزدیک‌تر است؟",
      opts: [
        [0, "I sometimes let people think others' good deeds were mine.", "گاهی می‌گذارم دیگران خیال کنند کار خیر دیگران مال من بوده."],
        [1, "I don't really give, so there's nothing to hide.", "واقعاً نمی‌بخشم، پس چیزی برای پنهان کردن نیست."],
        [2, "I give only through official channels where it's recorded.", "فقط از راه‌های رسمی می‌بخشم که ثبت شود."],
        [5, "I keep a private count of what I've given, and feel proud of it.", "در دلم حساب بخشش‌هایم را نگه می‌دارم و به آن افتخار می‌کنم."],
        [7, "I prefer anonymous ways of giving.", "راه‌های بی‌نام را ترجیح می‌دهم."],
        [9, "I don't keep track. I forget.", "حسابش را نگه نمی‌دارم. فراموش می‌کنم."]
      ]}
  ]}
];

const UI = {
  en: {
    title: "Stages of Generosity",
    introH: "A self-assessment of generosity",
    intro: "This questionnaire helps you see which stage of generosity you are at in each kind of giving: attention, credit, forgiveness, time and skill, material, and giving without announcing it. There are 18 questions. Choose the answer that is honestly true of you, not the one you wish were true.",
    privacy: "Your answers stay in your browser and are not sent anywhere. This is a mirror for finding your next step, not a judgment. Please use it only for yourself, never to score others.",
    boundary: "A note: forgiveness and self-giving never mean staying in harm. Generosity counts only when it is freely chosen.",
    stagesH: "The ten stages",
    start: "Start", next: "Next", back: "Back", finish: "See results",
    skip: "None of these fits me",
    of: "of",
    resultsH: "Your results",
    overall: "Overall",
    nextH: "Your next step",
    nextTxt: (item, s) => `Your lowest area is <b>${item}</b>, at the stage of <b>${s}</b>. Growing here will lift everything else.`,
    promptH: "Get suggestions for growth",
    promptTxt: "Copy this text and give it to an AI assistant (LLM). It will suggest ways to grow toward the next stage.",
    copy: "Copy text", copied: "Copied", restart: "Start again",
    noData: "No answers"
  },
  fa: {
    title: "مراتب کرم",
    introH: "خودسنجی بخشندگی",
    intro: "این پرسشنامه به شما کمک می‌کند ببینید در هر نوع بخشش در کدام مرتبه هستید: توجه، قدردانی، گذشت، وقت و مهارت، مال، و بخشش پنهان. ۱۸ پرسش دارد. پاسخی را انتخاب کنید که صادقانه دربارهٔ شما درست است، نه آنچه آرزو دارید درست باشد.",
    privacy: "پاسخ‌های شما فقط در مرورگرتان می‌ماند و جایی فرستاده نمی‌شود. این آینه‌ای برای یافتن قدم بعدی است، نه داوری. لطفاً فقط برای خودتان از آن استفاده کنید، نه برای سنجیدن دیگران.",
    boundary: "یادآوری: گذشت و ایثار هرگز به معنای ماندن در آسیب نیست. بخشش تنها وقتی ارزش دارد که آزادانه انتخاب شود.",
    stagesH: "ده مرتبه",
    start: "شروع", next: "بعدی", back: "قبلی", finish: "دیدن نتیجه",
    skip: "هیچ‌کدام دربارهٔ من صدق نمی‌کند",
    of: "از",
    resultsH: "نتیجهٔ شما",
    overall: "مرتبهٔ کلی",
    nextH: "قدم بعدی شما",
    nextTxt: (item, s) => `پایین‌ترین بخش شما <b>${item}</b> است، در مرتبهٔ <b>${s}</b>. رشد در این بخش، همه‌چیز را بالا می‌برد.`,
    promptH: "دریافت پیشنهاد برای رشد",
    promptTxt: "این متن را کپی کنید و به یک دستیار هوش مصنوعی بدهید تا راه‌های رسیدن به مرتبهٔ بعد را پیشنهاد کند.",
    copy: "کپی متن", copied: "کپی شد", restart: "شروع دوباره",
    noData: "بدون پاسخ"
  }
};

// Flatten questions and shuffle option order once per load
const QUESTIONS = [];
ITEMS.forEach((item, ii) => item.qs.forEach(q => {
  const order = q.opts.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  QUESTIONS.push({ ii, q, order });
}));

let lang = "en";
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null); // option index, -1 = skip
let view = "intro";

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "fa" ? "rtl" : "ltr";
  document.getElementById("btn-en").classList.toggle("on", l === "en");
  document.getElementById("btn-fa").classList.toggle("on", l === "fa");
  render();
}

function toFa(n) {
  return lang === "fa" ? String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]) : String(n);
}

function stageName(s) {
  return lang === "fa" ? STAGES[s].fa : STAGES[s].en;
}

function show(id) {
  ["intro", "quiz", "results"].forEach(x => document.getElementById(x).classList.toggle("hidden", x !== id));
  view = id;
}

function render() {
  const t = UI[lang];
  document.getElementById("title").textContent = t.title;
  document.title = t.title;
  if (view === "intro") renderIntro();
  else if (view === "quiz") renderQuiz();
  else renderResults();
}

function renderIntro() {
  const t = UI[lang];
  const rows = STAGES.map((s, i) =>
    `<tr><td>${toFa(i * 10)}–${toFa(i === 9 ? 100 : i * 10 + 9)}</td><td><b>${lang === "fa" ? s.fa : s.en}</b> · ${lang === "fa" ? s.dfa : s.den}</td></tr>`
  ).join("");
  document.getElementById("intro").innerHTML = `
    <h2>${t.introH}</h2>
    <p>${t.intro}</p>
    <p class="muted note">${t.privacy}</p>
    <p class="muted note">${t.boundary}</p>
    <h2 style="margin-top:20px">${t.stagesH}</h2>
    <table class="stages">${rows}</table>
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="startQuiz()">${t.start}</button></div>`;
}

function startQuiz() { current = 0; show("quiz"); renderQuiz(); }

function renderQuiz() {
  const t = UI[lang];
  const { ii, q, order } = QUESTIONS[current];
  const item = ITEMS[ii];
  const pct = Math.round((current / QUESTIONS.length) * 100);
  const opts = order.map(oi => {
    const o = q.opts[oi];
    return `<button class="opt ${answers[current] === oi ? "sel" : ""}" onclick="choose(${oi})">${lang === "fa" ? o[2] : o[1]}</button>`;
  }).join("");
  const last = current === QUESTIONS.length - 1;
  document.getElementById("quiz").innerHTML = `
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="muted" style="font-size:.85rem">${toFa(current + 1)} ${t.of} ${toFa(QUESTIONS.length)}</div>
    <span class="tag">${lang === "fa" ? item.fa : item.en}</span>
    <div class="q">${lang === "fa" ? q.fa : q.en}</div>
    ${opts}
    <button class="opt skip ${answers[current] === -1 ? "sel" : ""}" onclick="choose(-1)">${t.skip}</button>
    <div class="row">
      <button class="btn ghost" onclick="go(-1)" ${current === 0 ? "disabled" : ""}>${t.back}</button>
      <button class="btn" onclick="go(1)" ${answers[current] === null ? "disabled" : ""}>${last ? t.finish : t.next}</button>
    </div>`;
}

function choose(oi) { answers[current] = oi; renderQuiz(); }

function go(d) {
  if (d === 1 && current === QUESTIONS.length - 1) { show("results"); renderResults(); window.scrollTo(0, 0); return; }
  current = Math.max(0, Math.min(QUESTIONS.length - 1, current + d));
  renderQuiz();
}

function compute() {
  const items = ITEMS.map((item, ii) => {
    const stages = [];
    QUESTIONS.forEach((Q, qi) => {
      if (Q.ii === ii && answers[qi] !== null && answers[qi] >= 0) stages.push(Q.q.opts[answers[qi]][0]);
    });
    if (!stages.length) return { ii, score: null, stage: null };
    const mean = stages.reduce((a, b) => a + b, 0) / stages.length;
    const score = Math.min(100, Math.round(mean * 10 + 5));
    return { ii, score, stage: Math.min(9, Math.floor(score / 10)) };
  });
  const valid = items.filter(x => x.score !== null);
  let overall = null, overallStage = null, weakest = null;
  if (valid.length) {
    overall = Math.round(valid.reduce((a, b) => a + b.score, 0) / valid.length);
    overallStage = Math.min(9, Math.floor(overall / 10));
    weakest = valid.reduce((a, b) => (b.score < a.score ? b : a));
  }
  return { items, overall, overallStage, weakest };
}

function renderResults() {
  const t = UI[lang];
  const r = compute();
  const bars = r.items.map(x => {
    const name = lang === "fa" ? ITEMS[x.ii].fa : ITEMS[x.ii].en;
    if (x.score === null) return `<div class="item-res"><div class="top"><span>${name}</span><span class="muted">${t.noData}</span></div></div>`;
    return `<div class="item-res">
      <div class="top"><span>${name}</span><span>${toFa(x.score)}</span></div>
      <div class="bar"><div style="width:${x.score}%"></div></div>
      <div class="muted" style="font-size:.88rem">${stageName(x.stage)}</div></div>`;
  }).join("");
  const overallHtml = r.overall === null ? "" : `
    <div class="overall">
      <div class="muted">${t.overall}</div>
      <div class="num">${toFa(r.overall)}</div>
      <div class="stage">${stageName(r.overallStage)}</div>
      <div class="muted" style="font-size:.9rem">${lang === "fa" ? STAGES[r.overallStage].dfa : STAGES[r.overallStage].den}</div>
    </div>`;
  const nextHtml = r.weakest ? `<div class="next"><b>${t.nextH}</b><br>${t.nextTxt(lang === "fa" ? ITEMS[r.weakest.ii].fa : ITEMS[r.weakest.ii].en, stageName(r.weakest.stage))}</div>` : "";
  document.getElementById("results").innerHTML = `
    <div class="card">
      <h2>${t.resultsH}</h2>
      ${overallHtml}
      ${bars}
      ${nextHtml}
    </div>
    <div class="card" style="margin-top:16px">
      <h2>${t.promptH}</h2>
      <p class="muted" style="margin:0">${t.promptTxt}</p>
      <textarea id="prompt" readonly>${escapeHtml(buildPrompt(r))}</textarea>
      <div class="row">
        <button class="btn ghost" onclick="restart()">${t.restart}</button>
        <button class="btn" id="copyBtn" onclick="copyPrompt()">${t.copy}</button>
      </div>
    </div>`;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function buildPrompt(r) {
  const date = new Date().toISOString().slice(0, 10);
  const fa = lang === "fa";
  const L = [];
  const stageList = STAGES.map((s, i) => `${i * 10}–${i === 9 ? 100 : i * 10 + 9}: ${fa ? s.fa : s.en} — ${fa ? s.dfa : s.den}`).join("\n");

  if (!fa) {
    L.push(`I completed a self-assessment of my generosity on ${date}. It uses a 10-stage scale from 0 to 100, rising toward The Bountiful, whose giving has no limit and expects no return.`);
    L.push("", "THE STAGES", stageList);
    L.push("", "MY RESULTS");
    r.items.forEach(x => L.push(`- ${ITEMS[x.ii].en}: ${x.score === null ? "no answers" : `${x.score}/100 — ${STAGES[x.stage].en}`}`));
    if (r.overall !== null) L.push(`- Overall: ${r.overall}/100 — ${STAGES[r.overallStage].en}`);
    if (r.weakest) L.push(`- Weakest area: ${ITEMS[r.weakest.ii].en}`);
    L.push("", "MY ANSWERS");
    QUESTIONS.forEach((Q, qi) => {
      const a = answers[qi];
      const ans = a === null ? "(not answered)" : a === -1 ? "(none of the options fit me)" : `${Q.q.opts[a][1]} [stage ${Q.q.opts[a][0]}]`;
      L.push(`[${ITEMS[Q.ii].en}] ${Q.q.en}\n  → ${ans}`);
    });
    L.push("", "WHAT I'D LIKE FROM YOU",
      "1. Briefly reflect back what these answers suggest about how I give, without judging me.",
      "2. Focus on my weakest area. Suggest 2–3 small, concrete daily or weekly practices that would help me move up one stage there.",
      "3. Look at the answers where I scored lowest and explain what inner shift (for example, letting go of expecting a return, or of needing to be seen) would help me most.",
      "4. Suggest one practice that would lift my overall stage.",
      "",
      "Please follow these principles:",
      "- Every suggestion should be something that, if everyone in the world did it, would make the world a better place.",
      "- Respect my free will: offer options for me to choose from; don't command or pressure me.",
      "- Generosity must be freely chosen and never self-destructive. Forgiveness and self-giving never mean staying in harm.",
      "- Keep practices small and realistic, so I can start today.");
  } else {
    L.push(`من در تاریخ ${date} یک خودسنجی بخشندگی انجام دادم. این خودسنجی بر پایهٔ مقیاسی ده‌مرتبه‌ای از ۰ تا ۱۰۰ است که به سوی کریم بالا می‌رود؛ کسی که بخششش حدی ندارد و انتظاری ندارد.`);
    L.push("", "مرتبه‌ها", stageList);
    L.push("", "نتیجهٔ من");
    r.items.forEach(x => L.push(`- ${ITEMS[x.ii].fa}: ${x.score === null ? "بدون پاسخ" : `${x.score} از ۱۰۰ — ${STAGES[x.stage].fa}`}`));
    if (r.overall !== null) L.push(`- مرتبهٔ کلی: ${r.overall} از ۱۰۰ — ${STAGES[r.overallStage].fa}`);
    if (r.weakest) L.push(`- ضعیف‌ترین بخش: ${ITEMS[r.weakest.ii].fa}`);
    L.push("", "پاسخ‌های من");
    QUESTIONS.forEach((Q, qi) => {
      const a = answers[qi];
      const ans = a === null ? "(بی‌پاسخ)" : a === -1 ? "(هیچ‌کدام صدق نمی‌کرد)" : `${Q.q.opts[a][2]} [مرتبهٔ ${Q.q.opts[a][0]}]`;
      L.push(`[${ITEMS[Q.ii].fa}] ${Q.q.fa}\n  ← ${ans}`);
    });
    L.push("", "آنچه از شما می‌خواهم",
      "۱. کوتاه و بدون داوری بگویید این پاسخ‌ها دربارهٔ شیوهٔ بخشش من چه نشان می‌دهند.",
      "۲. روی ضعیف‌ترین بخش من تمرکز کنید و ۲ تا ۳ تمرین کوچک و مشخص روزانه یا هفتگی پیشنهاد دهید که کمکم کند در آن بخش یک مرتبه بالاتر بروم.",
      "۳. به پاسخ‌هایی که کمترین امتیاز را داشتند نگاه کنید و بگویید چه تغییر درونی (مثلاً رها کردن انتظار جبران، یا نیاز به دیده‌شدن) بیشترین کمک را به من می‌کند.",
      "۴. یک تمرین پیشنهاد دهید که مرتبهٔ کلی مرا بالا ببرد.",
      "",
      "لطفاً این اصول را رعایت کنید:",
      "- هر پیشنهاد باید چیزی باشد که اگر همهٔ مردم جهان انجامش دهند، جهان جای بهتری برای زندگی شود.",
      "- به اختیار من احترام بگذارید: گزینه‌هایی برای انتخاب پیشنهاد دهید، نه دستور یا فشار.",
      "- بخشش باید آزادانه باشد و هرگز به خود آسیب نزند. گذشت و ایثار هرگز به معنای ماندن در آسیب نیست.",
      "- تمرین‌ها کوچک و واقع‌بینانه باشند تا بتوانم از همین امروز شروع کنم.",
      "",
      "لطفاً به فارسی پاسخ دهید.");
  }
  return L.join("\n");
}

function copyPrompt() {
  const ta = document.getElementById("prompt");
  const done = () => {
    const b = document.getElementById("copyBtn");
    b.textContent = UI[lang].copied;
    setTimeout(() => { b.textContent = UI[lang].copy; }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand("copy"); done(); });
  } else { ta.select(); document.execCommand("copy"); done(); }
}

function restart() {
  answers = new Array(QUESTIONS.length).fill(null);
  current = 0;
  show("intro");
  render();
  window.scrollTo(0, 0);
}

setLang("en");
</script>

<style>
  .bbp-home{display:block;max-width:860px;margin:0 auto;padding:12px 16px 0;font:500 .88rem/1.4 Inter,Vazirmatn,system-ui,sans-serif}
  html[lang="fa"] .bbp-home{font-family:Vazirmatn,Tahoma,sans-serif}
  .bbp-home a{color:inherit;opacity:.65;text-decoration:none}
  .bbp-home a:hover{opacity:1;text-decoration:underline}
</style>
<script>
(function(){
  var PAGE_LANG="en", OTHER="fa.html";
  // Show this page in its own language (the shared code starts in English).
  if(document.documentElement.lang!==PAGE_LANG){
    var t=document.getElementById("btn-"+PAGE_LANG)||document.getElementById("langBtn");
    if(t)t.click();
  }
  try{localStorage.setItem("bbp-lang",PAGE_LANG)}catch(e){}
  // The language button now opens the other language's page.
  ["langBtn","btn-fa"].forEach(function(id){
    var b=document.getElementById(id);
    if(b){b.removeAttribute("onclick");b.onclick=function(){location.href=OTHER};}
  });
  var g=document.getElementById("btn-en");if(g){g.removeAttribute("onclick");g.onclick=null;}
  var bar=document.createElement("nav");bar.className="bbp-home";
  var a=document.createElement("a");a.href="../index.html";a.textContent="← All paths";
  bar.appendChild(a);document.body.insertBefore(bar,document.body.firstChild);
})();
</script>
</body>
</html>
