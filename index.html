<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Becoming Better</title>
<meta name="description" content="Private, self-scored paths for growing in good qualities. English and Farsi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/core.css">
</head>
<body>
<div class="wrap">
  <header id="top"></header>
  <main id="app"></main>
</div>

<!-- Shared core: UI widgets and the list of qualities -->
<script src="core/widgets.js"></script>
<script src="core/items.js"></script>

<script>
// Words on the home page, in both languages (the home page switches in place)
const HOME = {
  en: {
    title: "Becoming Better", lang: "فارسی", theme: "Theme",
    eyebrow: "{n} paths · ten stages each",
    lede: "Short, private self-assessments that show where you stand in a quality today and what the next stage looks like. Answer honestly; nobody sees your answers but you.",
    meta: "{a} areas · {q} questions", go: "Begin →", last: "Last result: {s} · {d}",
    how: [
      ["Answer real situations", "Each question describes an everyday moment. Pick what you would actually do, not what you think you should."],
      ["See your stage", "You get a score for each area and an overall stage out of ten, with a description of the next one."],
      ["Watch it change", "Your results are saved on this device, so you can come back later and see how you have grown."],
      ["Choose your own practice", "Copy your results into an AI assistant for suggestions if you like. What to work on is always your choice."]
    ],
    foot: "Your answers never leave your browser. Nothing is sent to a server. These tools are for self-reflection, never for judging others."
  },
  fa: {
    title: "بهتر شدن", lang: "English", theme: "پوسته",
    eyebrow: "{n} مسیر · هر کدام ده مرحله",
    lede: "خودسنجی‌های کوتاه و خصوصی که نشان می‌دهند امروز در هر صفت کجا ایستاده‌اید و مرحلهٔ بعد چه شکلی است. صادقانه پاسخ دهید؛ پاسخ‌هایتان را جز خودتان کسی نمی‌بیند.",
    meta: "{a} حوزه · {q} پرسش", go: "← شروع", last: "آخرین نتیجه: {s} · {d}",
    how: [
      ["به موقعیت‌های واقعی پاسخ دهید", "هر پرسش یک لحظهٔ روزمره را توصیف می‌کند. آنچه واقعاً انجام می‌دهید را انتخاب کنید، نه آنچه فکر می‌کنید باید."],
      ["مرحلهٔ خود را ببینید", "برای هر حوزه امتیاز و یک مرحلهٔ کلی از ده می‌گیرید، همراه با توصیف مرحلهٔ بعد."],
      ["تغییر را ببینید", "نتیجه‌هایتان روی همین دستگاه ذخیره می‌شود تا بعداً برگردید و رشد خود را ببینید."],
      ["تمرین خود را انتخاب کنید", "اگر خواستید، نتیجه را در یک دستیار هوش مصنوعی بچسبانید تا پیشنهاد بگیرید. انتخاب اینکه روی چه کار کنید همیشه با خودتان است."]
    ],
    foot: "پاسخ‌هایتان هرگز از مرورگر شما بیرون نمی‌رود و به هیچ سروری فرستاده نمی‌شود. این ابزارها برای خودشناسی‌اند، نه برای قضاوت دیگران."
  }
};

// Open in the language the viewer used last
let lang = "en";
try { if (localStorage.getItem("bbp-lang") === "fa") lang = "fa"; } catch (e) {}

// "Last result" line on a card, from the results saved by the questionnaire
function lastResult(id) {
  const h = UI.store.get("bbp-history-" + id, []);
  if (!h || !h.length) return "";
  const e = h[h.length - 1];
  let d = "";
  try { d = new Date(e.t).toLocaleDateString(lang === "fa" ? "fa-IR" : "en-US", { month: "short", day: "numeric" }); } catch (err) {}
  return UI.fill(HOME[lang].last, { s: UI.num(e.overall), d: d });
}

function render() {
  const H = HOME[lang], root = document.documentElement;
  root.lang = lang; root.dir = lang === "fa" ? "rtl" : "ltr"; document.title = H.title;
  UI.rememberLang();

  document.getElementById("top").innerHTML =
    '<div class="ui-top"><div class="brand"></div><div class="tools">' +
    UI.button(H.lang, { id: "langBtn" }) +
    '<button type="button" data-ui="theme" aria-label="' + UI.esc(H.theme) + '">◐</button></div></div>';

  const cards = BBP_ITEMS.map((it, i) => UI.pathCard({
    href: it.id + "/" + lang + ".html",
    number: lang === "fa" ? UI.num(i + 1) : String(i + 1).padStart(2, "0"),
    name: it[lang].name, from: it[lang].from, to: it[lang].to,
    meta: UI.fill(H.meta, { a: UI.num(it.areas), q: UI.num(it.questions) }),
    go: H.go, last: lastResult(it.id)
  })).join("");

  document.getElementById("app").innerHTML =
    '<section class="hero"><p class="eyebrow">' + UI.esc(UI.fill(H.eyebrow, { n: UI.num(BBP_ITEMS.length) })) + "</p>" +
    UI.title(H.title) + UI.para(H.lede) + "</section>" +
    '<div class="path-grid">' + cards + "</div>" +
    '<section class="how">' + H.how.map(h => "<div>" + UI.heading(h[0]) + UI.para(h[1]) + "</div>").join("") + "</section>" +
    '<p class="foot">' + UI.esc(H.foot) + "</p>";

  UI.onClick("langBtn", () => { lang = lang === "en" ? "fa" : "en"; render(); });
  UI.initTheme();
}
render();
</script>
</body>
</html>
