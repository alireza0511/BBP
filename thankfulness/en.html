<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thankfulness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#faf7f2;--card:#ffffff;--text:#2a2622;--muted:#6f675e;--line:#e6dfd4;
  --accent:#a8692c;--accent-soft:#f4e7d6;--bar:#c98c4b;--track:#efe8dd;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140f;--card:#211e18;--text:#eee7dc;--muted:#a89f92;--line:#3a352c;
    --accent:#e0a866;--accent-soft:#3a2e1f;--bar:#d39a5c;--track:#2d2922;
  }
}
:root[data-theme="dark"]{
  --bg:#16140f;--card:#211e18;--text:#eee7dc;--muted:#a89f92;--line:#3a352c;
  --accent:#e0a866;--accent-soft:#3a2e1f;--bar:#d39a5c;--track:#2d2922;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
html[lang="fa"] body{font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
header h1{font-size:1.1rem;margin:0;font-weight:700}
.tools{display:flex;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
td.band{white-space:nowrap;color:var(--muted);width:1%}
td.name{font-weight:600;white-space:nowrap;width:1%}
.btn{border:none;border-radius:12px;padding:12px 20px;font-weight:600}
.primary{background:var(--accent);color:#fff}
html[data-theme="dark"] .primary{color:#1a150e}
@media (prefers-color-scheme: dark){html:not([data-theme="light"]) .primary{color:#1a150e}}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
.progress{height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.progress>div{height:100%;background:var(--bar);transition:width .25s}
.area-tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:600}
.q{font-size:1.08rem;font-weight:600;margin:14px 0 16px}
.opt{display:block;width:100%;text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;line-height:1.5}
.opt:hover{border-color:var(--bar)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.none{border-style:dashed;color:var(--muted)}
.bar-row{margin:12px 0}
.bar-head{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.bar-track{height:12px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;background:var(--bar);border-radius:99px}
.big{font-size:2.2rem;font-weight:700;color:var(--accent);line-height:1.2}
textarea{width:100%;min-height:240px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
html[lang="fa"] textarea{font-family:"Vazirmatn",Tahoma,sans-serif;font-size:14px}
.note{border-inline-start:3px solid var(--bar);padding-inline-start:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="tools">
      <button class="chip" id="langBtn"></button>
      <button class="chip" id="themeBtn" aria-label="Theme">◐</button>
    </div>
  </header>
  <main id="app"></main>
</div>

const QUESTIONS = [];
AREAS.forEach((ar, ai) => ar.qs.forEach(q => QUESTIONS.push(Object.assign({area: ai}, q))));

let lang = "en";
let idx = -1;            // -1 intro, 0..N-1 questions, N results
let answers = [];        // stage number or "none"
let orders = [];

function shuffle(n){
  const a = [...Array(n).keys()];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function reset(){
  answers = QUESTIONS.map(() => undefined);
  orders = QUESTIONS.map(q => shuffle(q.a.length));
  idx = -1;
}
function num(x){
  const s = String(x);
  return lang === "fa" ? s.replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]) : s;
}
function t(k, vars){
  let s = T[lang][k];
  if (vars) for (const v in vars) s = s.split("{" + v + "}").join(vars[v]);
  return s;
}
function band(i){ return num(i * 10) + "–" + num(i === 9 ? 100 : i * 10 + 9); }
function stageName(i){ return STAGES[i][lang][0]; }
function stageLabel(i){ return t("stage") + " " + num(i) + " · " + stageName(i); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function areaScore(ai){
  const st = [];
  QUESTIONS.forEach((q, qi) => { if (q.area === ai && typeof answers[qi] === "number") st.push(answers[qi]); });
  if (!st.length) return null;
  const avg = st.reduce((a, b) => a + b, 0) / st.length;
  return Math.min(100, Math.round(avg * 10 + 5));   // middle of the stage's band
}
function scoreStage(s){ return Math.min(9, Math.floor(s / 10)); }

function computeResults(){
  const areas = AREAS.map((ar, ai) => ({ai, name: ar[lang], score: areaScore(ai)}));
  const scored = areas.filter(a => a.score !== null);
  if (!scored.length) return {areas, overall: null, lowest: null};
  const overall = Math.round(scored.reduce((s, a) => s + a.score, 0) / scored.length);
  let lowest = scored[0];
  scored.forEach(a => { if (a.score < lowest.score) lowest = a; });
  return {areas, overall, lowest};
}

const app = document.getElementById("app");

function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  document.getElementById("title").textContent = t("title");
  document.title = t("title");
  document.getElementById("langBtn").textContent = t("langBtn");
  if (idx < 0) renderIntro();
  else if (idx < QUESTIONS.length) renderQuestion();
  else renderResults();
  window.scrollTo(0, 0);
}

function renderIntro(){
  const rows = STAGES.map((s, i) =>
    `<tr><td class="band">${band(i)}</td><td class="name">${esc(s[lang][0])}</td><td>${esc(s[lang][1])}</td></tr>`).join("");
  app.innerHTML = `
   <div class="card"><h2>${t("purposeH")}</h2><p>${t("purpose")}</p></div>
   <div class="card"><h2>${t("stagesH")}</h2><table>${rows}</table></div>
   <div class="card"><h2>${t("privacyH")}</h2><p class="note">${t("privacy")}</p>
     <h2 style="margin-top:14px">${t("limitsH")}</h2><p class="note">${t("limits")}</p></div>
   <button class="btn primary" id="begin">${t("begin")}</button>`;
  document.getElementById("begin").onclick = () => { idx = 0; render(); };
}

function renderQuestion(){
  const q = QUESTIONS[idx];
  const total = QUESTIONS.length;
  const pct = Math.round((idx / total) * 100);
  const sel = answers[idx];
  const opts = orders[idx].map(oi => {
    const a = q.a[oi];
    const isSel = sel === a[0] && answers["_o" + idx] === oi;
    return `<button class="opt${isSel ? " sel" : ""}" data-o="${oi}">${esc(lang === "en" ? a[1] : a[2])}</button>`;
  }).join("");
  const isLast = idx === total - 1;
  app.innerHTML = `
   <div class="card">
     <div class="muted" style="font-size:.9rem">${t("qOf", {n: num(idx + 1), t: num(total)})}</div>
     <div class="progress"><div style="width:${pct}%"></div></div>
     <span class="area-tag">${esc(AREAS[q.area][lang])}</span>
     <div class="q">${esc(q[lang])}</div>
     ${opts}
     <button class="opt none${sel === "none" ? " sel" : ""}" data-o="none">${t("none")}</button>
     <div class="row">
       <button class="btn ghost" id="back">${t("back")}</button>
       <button class="btn primary" id="next" ${sel === undefined ? "disabled" : ""}>${isLast ? t("finish") : t("next")}</button>
     </div>
   </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const o = b.dataset.o;
    if (o === "none") { answers[idx] = "none"; delete answers["_o" + idx]; }
    else { answers[idx] = q.a[+o][0]; answers["_o" + idx] = +o; }
    renderQuestion();
  });
  document.getElementById("back").onclick = () => { idx -= 1; render(); };
  document.getElementById("next").onclick = () => { if (answers[idx] !== undefined) { idx += 1; render(); } };
}

function renderResults(){
  const r = computeResults();
  if (r.overall === null) {
    app.innerHTML = `<div class="card"><p>${t("noneScored")}</p></div>
      <button class="btn primary" id="restart">${t("restart")}</button>`;
    document.getElementById("restart").onclick = () => { reset(); render(); };
    return;
  }
  const bars = r.areas.map(a => a.score === null
    ? `<div class="bar-row"><div class="bar-head"><span>${esc(a.name)}</span><span class="muted">${t("notScored")}</span></div></div>`
    : `<div class="bar-row"><div class="bar-head"><span>${esc(a.name)}</span><span><b>${num(a.score)}</b> <span class="muted">· ${esc(stageName(scoreStage(a.score)))}</span></span></div>
       <div class="bar-track"><div class="bar-fill" style="width:${a.score}%"></div></div></div>`).join("");
  const os = scoreStage(r.overall);
  const ls = scoreStage(r.lowest.score);
  const next = ls >= 9
    ? t("nextStepTop", {area: r.lowest.name, from: stageLabel(ls)})
    : t("nextStep", {area: r.lowest.name, from: stageLabel(ls), to: stageLabel(ls + 1)});
  app.innerHTML = `
   <div class="card"><h2>${t("resultsH")}</h2>
     <div class="muted">${t("overall")}</div>
     <div class="big">${num(r.overall)} <span style="font-size:1rem">/ ${num(100)}</span></div>
     <div style="font-weight:600;margin-bottom:6px">${esc(stageLabel(os))}</div>
     <p class="muted">${esc(STAGES[os][lang][1])}</p>
     ${bars}
   </div>
   <div class="card"><h2>${t("nextStepH")}</h2><p>${esc(next)}</p>
     <p class="muted">${esc(STAGES[Math.min(9, ls + 1)][lang][1])}</p></div>
   <div class="card"><h2>${t("llmH")}</h2><p class="muted">${t("llmNote")}</p>
     <textarea id="llm" readonly>${esc(buildLLM(r))}</textarea>
     <div class="row"><button class="btn ghost" id="restart">${t("restart")}</button>
     <button class="btn primary" id="copy">${t("copy")}</button></div></div>`;
  document.getElementById("restart").onclick = () => { reset(); render(); };
  document.getElementById("copy").onclick = copyLLM;
}

function buildLLM(r){
  const fa = lang === "fa";
  const L = [];
  const date = new Date().toLocaleDateString(fa ? "fa-IR" : "en-US", {year:"numeric", month:"long", day:"numeric"});
  const os = scoreStage(r.overall), ls = scoreStage(r.lowest.score);
  if (!fa) {
    L.push("Thankfulness self-assessment — " + date, "");
    L.push("STANDING RULES FOR YOUR REPLY");
    L.push("- Universalizability: check that every suggestion, if everyone in the world did it, would make the world a better place.");
    L.push("- Free will: never pressure or command me. This assessment is self-scored, private, and only for myself, never for scoring others. I choose my own next step.");
    L.push("- Healthy limits: the highest stages must be freely chosen and never self-destructive. Gratitude never means accepting mistreatment, hiding pain, or staying silent about real needs or injustice.", "");
    L.push("THE TEN STAGES");
  } else {
    L.push("خودارزیابی شکرگزاری — " + date, "");
    L.push("قواعد پاسخ تو");
    L.push("- جهان‌شمول بودن: بررسی کن که هر پیشنهاد، اگر همهٔ مردم جهان انجامش دهند، جهان را جای بهتری کند.");
    L.push("- اختیار: هرگز به من فشار نیاور و دستور نده. این ارزیابی را خودم نمره داده‌ام، خصوصی است و فقط برای خودم است، هرگز برای سنجیدن دیگران. قدم بعدی را خودم انتخاب می‌کنم.");
    L.push("- حد سالم: بالاترین مرحله‌ها باید آزادانه انتخاب شوند و هرگز به خود آسیب نزنند. شکر هرگز به معنای پذیرفتن بدرفتاری، پنهان کردن درد یا سکوت دربارهٔ نیازهای واقعی و بی‌عدالتی نیست.", "");
    L.push("ده مرحله");
  }
  STAGES.forEach((s, i) => L.push(band(i) + "  " + (fa ? "مرحلهٔ " : "Stage ") + num(i) + " · " + s[lang][0] + " — " + s[lang][1]));
  L.push("", fa ? "نمره‌ها" : "SCORES");
  r.areas.forEach(a => L.push("- " + a.name + ": " + (a.score === null ? t("notScored") : num(a.score) + " (" + stageLabel(scoreStage(a.score)) + ")")));
  L.push((fa ? "کلی: " : "Overall: ") + num(r.overall) + " (" + stageLabel(os) + ")");
  L.push((fa ? "ضعیف‌ترین حوزه: " : "Weakest area: ") + r.lowest.name + " (" + stageLabel(ls) + ")", "");
  L.push(fa ? "پرسش‌ها و پاسخ‌های من" : "MY ANSWERS");
  AREAS.forEach((ar, ai) => {
    L.push("", "[" + ar[lang] + "]");
    QUESTIONS.forEach((q, qi) => {
      if (q.area !== ai) return;
      L.push((fa ? "پرسش: " : "Q: ") + q[lang]);
      const a = answers[qi];
      if (a === "none" || a === undefined) L.push((fa ? "پاسخ: " : "A: ") + t("none") + (fa ? " (بدون نمره)" : " (not scored)"));
      else {
        const o = q.a[answers["_o" + qi]];
        L.push((fa ? "پاسخ: " : "A: ") + (fa ? o[2] : o[1]) + " (" + stageLabel(a) + ")");
      }
    });
  });
  L.push("");
  const toStage = ls >= 9 ? stageLabel(9) : stageLabel(ls + 1);
  if (!fa) {
    L.push("PLEASE GIVE ME");
    L.push("1. 2–3 small, concrete practices to move up one stage in my weakest area (" + r.lowest.name + "), from " + stageLabel(ls) + " toward " + toStage + ".");
    L.push("2. One inner shift that would help me most.");
    L.push("3. One practice for my overall stage (" + stageLabel(os) + ").");
    L.push("Keep every suggestion within the standing rules above. Please reply in English.");
  } else {
    L.push("لطفاً به من بده");
    L.push("۱. دو یا سه تمرین کوچک و مشخص برای بالا رفتن یک مرحله در ضعیف‌ترین حوزه‌ام («" + r.lowest.name + "»)، از " + stageLabel(ls) + " به سوی " + toStage + ".");
    L.push("۲. یک تغییر درونی که بیشترین کمک را به من می‌کند.");
    L.push("۳. یک تمرین برای مرحلهٔ کلی‌ام (" + stageLabel(os) + ").");
    L.push("همهٔ پیشنهادها را در چارچوب قواعد بالا نگه دار. لطفاً به فارسی پاسخ بده.");
  }
  return L.join("\n");
}

function copyLLM(){
  const ta = document.getElementById("llm");
  const btn = document.getElementById("copy");
  const done = () => { btn.textContent = t("copied"); setTimeout(() => { btn.textContent = t("copy"); }, 1800); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand("copy"); done(); });
  } else { ta.select(); document.execCommand("copy"); done(); }
}

document.getElementById("langBtn").onclick = () => { lang = lang === "en" ? "fa" : "en"; render(); };
document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};

reset();
render();
</script>
